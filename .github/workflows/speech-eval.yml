name: Speech evaluation

# Sends every clip in a private archive to /api/transcribe once and keeps the word error rates.
# Each clip reaches Cloudflare Workers AI and counts against the day's allowance, so this runs only
# when someone starts it. See packages/api/evaluation/speech/README.md.
on:
  workflow_dispatch:
    inputs:
      # Only production: a preview runs unreviewed branch code, and would receive every speaker's voice.
      base_url:
        description: Weave deployment to send the clips to
        type: choice
        options:
          - https://weave.regencommons.com
        default: https://weave.regencommons.com

permissions:
  contents: read

concurrency:
  group: speech-evaluation
  cancel-in-progress: false

jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SPEECH_CLIPS_URL is a secret of this environment, so reviewers and a branch rule can guard it.
    environment: speech-evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Fetch the clips
        env:
          SPEECH_CLIPS_URL: ${{ secrets.SPEECH_CLIPS_URL }}
        run: |
          if [ -z "$SPEECH_CLIPS_URL" ]; then
            echo "::error::Set SPEECH_CLIPS_URL in the speech-evaluation environment to a private .tar.gz of the clips and manifest.json. See packages/api/evaluation/speech/README.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/clips"
          curl --fail --silent --show-error --location --max-time 120 "$SPEECH_CLIPS_URL" | tar -xz -C "$RUNNER_TEMP/clips"
      - name: Send every clip once
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: >-
          bun run --filter @weave/api eval:speech --
          --manifest "$RUNNER_TEMP/clips/manifest.json"
          --base "$BASE_URL"
          --output "$RUNNER_TEMP/speech-report.json"
      # The report holds rates, edits and timings, and no words: the repository is public.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: speech-report
          path: ${{ runner.temp }}/speech-report.json
          if-no-files-found: ignore
          retention-days: 30
