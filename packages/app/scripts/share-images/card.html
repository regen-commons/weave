<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weave share image</title>
<!-- Draws one 1200 x 630 link-preview picture on a canvas, in the style of the Regen Commons
     website's (scripts/share-images/template.html there). render.mjs passes the headline in the
     address and screenshots the page with a headless browser. The same faces and palette as the
     site, and the mycelium is seeded by the picture's name, so rendering again gives the same
     picture. -->
<style>
  @font-face { font-family: "Fraunces"; font-weight: 100 900; font-display: block; src: url("../../../design-system/fonts/fraunces-latin.woff2") format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 400; font-display: block; src: url("../../../design-system/fonts/fraunces-italic-latin.woff2") format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-style: italic; font-weight: 400; font-display: block; src: url("../../../design-system/fonts/source-serif-4-italic-latin.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 300 700; font-display: block; src: url("../../../design-system/fonts/space-grotesk-latin.woff2") format("woff2"); }
  html, body { margin: 0; background: #0D100A; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="card" width="1200" height="630"></canvas>
<script>
  const query = new URLSearchParams(location.search);
  const name = query.get("name") || "home";
  const list = (key, fallback) => (query.get(key) || fallback).split("|").filter(Boolean);
  const copy = { lines: list("lines", "Find partners|and funding for"), accent: list("accent", "regenerative work") };
  const host = (query.get("host") || "weave.regencommons.com").toUpperCase();
  const W = 1200, H = 630, PAD = 80;
  const INK = "#E2DAC8", INK_MID = "#B8AE96", FOREST = "#7AAA6A", COPPER = "#C47838", PAPER = "#0D100A";
  const canvas = document.getElementById("card");
  const ctx = canvas.getContext("2d");

  // A small seeded generator (mulberry32), so each picture's pattern is the same every time.
  let seed = [...name].reduce((sum, ch) => sum * 31 + ch.charCodeAt(0), 7) >>> 0;
  const random = () => {
    seed = (seed + 0x6d2b79f5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const colors = ["122,170,106", "142,196,114", "196,120,56", "72,184,144", "212,160,48"];

  function grow(x, y, angle, length, depth, color) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    const steps = Math.max(4, Math.round(length / 14));
    const branches = [];
    for (let i = 0; i < steps; i++) {
      angle += (random() - 0.5) * 0.5;
      x += Math.cos(angle) * 14;
      y += Math.sin(angle) * 14;
      ctx.lineTo(x, y);
      if (depth > 0 && random() < 0.18) branches.push([x, y, angle + (random() < 0.5 ? -1 : 1) * (0.5 + random() * 0.6)]);
    }
    const alpha = 0.16 + depth * 0.1;
    ctx.strokeStyle = `rgba(${color},${alpha})`;
    ctx.lineWidth = 0.8 + depth * 0.45;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 1.6 + depth * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${color},${alpha + 0.15})`;
    ctx.fill();
    for (const [bx, by, ba] of branches) grow(bx, by, ba, length * 0.6, depth - 1, color);
  }

  function drawMark(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 48, size / 48);
    ctx.beginPath();
    ctx.arc(24, 24, 24, 0, Math.PI * 2);
    ctx.fillStyle = "#141810";
    ctx.fill();
    ctx.strokeStyle = "#a6b878";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.stroke(new Path2D("M24 24 12 11m12 13L37 11M24 24l-1 17m1-17L7 27m17-3 17 6M17 17l1-9m13 9 9 1M23 33l-8 5"));
    ctx.beginPath();
    ctx.arc(24, 24, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#c9956b";
    ctx.fill();
    ctx.restore();
  }

  async function draw() {
    await Promise.all([
      document.fonts.load('300 96px "Fraunces"'),
      document.fonts.load('italic 400 96px "Fraunces"'),
      document.fonts.load('italic 400 26px "Source Serif 4"'),
      document.fonts.load('500 17px "Space Grotesk"'),
    ]);

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    const cx = 955, cy = 290;
    for (let i = 0; i < 11; i++) grow(cx, cy, (i / 11) * Math.PI * 2 + random() * 0.4, 150 + random() * 120, 3, colors[i % colors.length]);
    ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fillStyle = "rgba(196,120,56,0.10)"; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fillStyle = "#C9956B"; ctx.fill();

    // Keep the headline readable: fade the pattern out behind the words.
    const fade = ctx.createLinearGradient(0, 0, W, 0);
    fade.addColorStop(0, "rgba(13,16,10,1)");
    fade.addColorStop(0.52, "rgba(13,16,10,1)");
    fade.addColorStop(0.66, "rgba(13,16,10,0)");
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, W, H);

    drawMark(PAD, 72, 52);
    ctx.fillStyle = INK;
    ctx.font = '500 17px "Space Grotesk"';
    ctx.letterSpacing = "5.4px";
    ctx.textBaseline = "middle";
    ctx.fillText("WEAVE", PAD + 70, 72 + 27);

    // Headline: shrink until it fits beside the pattern.
    const plainFont = (size) => `300 ${size}px "Fraunces"`;
    const accentFont = (size) => `italic 400 ${size}px "Fraunces"`;
    const lines = copy.lines.map((text) => [text, plainFont]).concat(copy.accent.map((text) => [text, accentFont]));
    ctx.letterSpacing = "0px";
    let size = 96;
    const widest = () => Math.max(...lines.map(([text, font]) => { ctx.font = font(size); return ctx.measureText(text).width; }));
    while ((widest() > 720 || lines.length * size * 1.04 > 290) && size > 48) size -= 4;
    ctx.textBaseline = "alphabetic";
    let y = 188 + size * 0.86;
    for (const [text, font] of lines) {
      ctx.font = font(size);
      ctx.fillStyle = font === accentFont ? FOREST : INK;
      ctx.fillText(text, PAD, y);
      y += size * 1.04;
    }

    ctx.fillStyle = "rgba(196,120,56,0.28)";
    ctx.fillRect(PAD, H - 118, W - PAD * 2, 1);
    ctx.fillStyle = INK_MID;
    ctx.font = 'italic 400 26px "Source Serif 4"';
    ctx.fillText("Part of Regen Commons.", PAD, H - 62);
    ctx.fillStyle = COPPER;
    ctx.font = '500 16px "Space Grotesk"';
    ctx.letterSpacing = "3.5px";
    ctx.textAlign = "right";
    ctx.fillText(host, W - PAD, H - 66);

    document.body.dataset.ready = "true";
  }
  draw();
</script>
</body>
</html>
